services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: wp
    volumes:
      - db:/var/lib/mysql
    networks:
      - backend

  wordpress1:
    image: wordpress:5.4.2-php7.2-apache
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - ./html:/var/www/html
    networks:
      - backend
      - frontend
    depends_on:
      - db

  wordpress2:
    image: wordpress:5.4.2-php7.2-apache
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - ./html:/var/www/html
    networks:
      - backend
      - frontend
    depends_on:
      - db

  wordpress3:
    image: wordpress:5.4.2-php7.2-apache
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - ./html:/var/www/html
    networks:
      - backend
      - frontend
    depends_on:
      - db

  nginx:
    image: nginx:1.19.0
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - frontend
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3

networks:
  frontend:
  backend:

volumes:
  db:
